suite: main
datasets:
  - yelp_academic
  - amazon_video
models:
  - mlp
  - gcn
  - gat
  - graphsage
  - care_gnn
  - graphconsis
  - pc_gnn
  - bwgnn
  - linkx
  - dgp
  - mled
  - hero
seeds: [0, 1, 2, 3, 4]
device: cuda
output_dir: outputs/submission_unified
metrics:
  - Macro-F1
  - AUROC
  - AUPRC
notes:
  - Text-rich main results only; transfer datasets are configured in transfer_5seed.yaml.
  - model=hero maps to hero_full in scripts/run_experiment_suite.py.
  - missing raw results must remain missing or skipped, never imputed.
