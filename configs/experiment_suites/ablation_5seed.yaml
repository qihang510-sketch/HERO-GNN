suite: ablation
datasets:
  - yelp_academic
  - amazon_video
variants:
  - hero_full
  - hero_no_llm
  - hero_no_mechanism
  - hero_no_risk_weighting
  - hero_no_relation_loss
  - hero_no_chain_consistency
  - hero_structure_only
  - hero_semantic_only
  - hero_no_dual_branch
seeds: [0, 1, 2, 3, 4]
device: cuda
output_dir: outputs/submission_unified
metrics:
  - Macro-F1
  - AUROC
  - AUPRC
notes:
  - ablations are currently runnable for text-rich datasets only.
  - unsupported variants are marked skipped/unavailable, never filled with fake metrics.
