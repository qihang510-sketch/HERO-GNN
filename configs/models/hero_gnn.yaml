name: hero_gnn
display_name: HERO-GNN
implementation_source: project
forbidden_lite_name: false
use_risk_relevant_heterophily: true
use_mechanism_annotation: true
use_evidence_chain: true
use_llm_annotation: true
use_heterophily_filter: true
use_dual_branch_encoder: true
use_gated_fusion: true
heterophily_weight_mode: relevance_confidence
encoder_type: dual_branch
fusion_type: gated
labeler_source: llm_or_mock
risk_relevance_threshold: 0.45
neighbor_budget: 5
hetero_branch_weight: 1.0
mechanism_loss_weight: 0.0
chain_loss_weight: 0.03
routing_loss_weight: 0.01
learning_rate: 0.001
dropout: 0.2
weight_decay: 0.0001
class_weight_strategy: inverse_frequency
use_class_weight: true
loss_type: bce
focal_gamma: 2.0
optimizer: adamw
scheduler: reduce_on_plateau
scheduler_patience: 10
scheduler_factor: 0.5
scheduler_min_lr: 0.000001
early_stopping_patience: 30
early_stopping_metric: AUPRC
risk_weight_temperature: 1.0
